<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Optimo · Full operations workspace</title><link rel="stylesheet" href="/src/full-workspace.css"></head>
<body>
<aside class="workspace-side"><div class="brand"><i></i>OPTIMO</div><div class="side-caption">OPERATIONS</div><nav><button data-action="area" data-id="home" class="active"><span class="nav-symbol">◫</span>Dashboard</button><button data-action="area" data-id="events"><span class="nav-symbol">▤</span>Events</button><button data-action="area" data-id="resources"><span class="nav-symbol">♧</span>Resources</button><button data-action="area" data-id="facilities"><span class="nav-symbol">▦</span>Facilities</button><button data-action="progress"><span class="nav-symbol">◷</span>Action centre</button><button data-action="show-tasks"><span class="nav-symbol">⌕</span>Find a task</button></nav><div class="side-bottom"><button data-action="help">Guidance & reference data</button><div class="side-tag">FULL WORKFLOW CONCEPT</div></div></aside>
